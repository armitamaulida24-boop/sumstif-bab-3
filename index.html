<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMATIF BAB III TAHUN PELAJARAN 2025/2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Data Soal (25 Soal Koding & AI)
        const questionsData = [
            { id: 1, question: "Di era KA, pemikiran kritis sangat penting untuk...", options: ["Membantu KA agar lebih cepat berpikir.", "Menghafal semua jawaban yang diberikan KA.", "Membedakan mana informasi yang benar dan mana yang merupakan halusinasi KA.", "Membuat komputer menjadi tahan lama."], answer: 2 },
            { id: 2, question: "Isu hak cipta pada hasil karya KA generatif masih menjadi perdebatan karena...", options: ["KA tidak bisa menggambar dengan bagus.", "KA tidak perlu membayar pajak.", "Hasil karyanya dibuat oleh mesin berdasarkan data karya manusia lain.", "Aplikasi KA sangat mahal harganya."], answer: 2 },
            { id: 3, question: "Dampak positif KA di bidang kesehatan adalah….", options: ["Membuat orang malas berolahraga.", "Membantu dokter mendeteksi penyakit melalui analisis gambar medis lebih cepat.", "Menghapus semua rekam medis pasien.", "Menggantikan peran dokter secara total tanpa pengawasan."], answer: 1 },
            { id: 4, question: "KA dikatakan sebagai 'dokumen hidup' dalam konteks pengembangannya?", options: ["Karena KA terus diperbarui dan dimutakhirkan sesuai perkembangan zaman.", "Karena KA bisa bernapas.", "Karena KA bisa berbicara seperti manusia.", "Karena KA tidak bisa rusak."], answer: 0 },
            { id: 5, question: "Contoh perilaku yang TIDAK etis dalam menggunakan KA untuk tugas sekolah adalah...", options: ["Menyalin seluruh jawaban KA dan mengakuinya sebagai tulisan sendiri.", "Meminta KA menjelaskan konsep yang sulit dipahami.", "Menggunakan KA untuk memeriksa kesalahan ketik (typo).", "Mencari ide projek melalui saran dari KA."], answer: 0 },
            { id: 6, question: "Yang dimaksud dengan 'Model' dalam Kecerdasan Artifisial adalah….", options: ["Orang yang memperagakan pakaian.", "Hasil dari proses pelatihan KA yang sudah bisa mengenali pola.", "Bentuk fisik dari komputer.", "Merk dari aplikasi KA."], answer: 1 },
            { id: 7, question: "Yang menjadi 'bahan bakar' utama bagi sistem Kecerdasan Artifisial untuk dapat belajar dan berkembang adalah….", options: ["Baterai yang kuat", "Kabel internet yang panjang", "Data dalam jumlah besar", "Layar monitor yang jernih"], answer: 2 },
            { id: 8, question: "KA Generatif sering digunakan untuk membuat ringkasan teks. Bahaya utama jika kita langsung menggunakan ringkasan tersebut tanpa diperiksa kembali adalah….", options: ["Ringkasan tersebut mungkin terlalu pendek.", "Warna teks ringkasan akan sulit dibaca.", "Ringkasan tersebut akan menghapus file asli.", "KA mungkin melewatkan poin penting atau menambahkan informasi palsu."], answer: 3 },
            { id: 9, question: "Jika sebuah perusahaan teknologi hanya menggunakan data dari satu negara saja untuk melatih KA pengenal wajah, apa yang kemungkinan besar akan terjadi?", options: ["KA akan menjadi sangat lambat.", "KA akan sulit mengenali wajah orang dari negara atau ras lain (Bias).", "KA akan berhenti bekerja secara otomatis.", "KA akan meminta data dari internet secara acak."], answer: 1 },
            { id: 10, question: "Peran utama 'Prompt' dalam penggunaan KA Generatif adalah….", options: ["Sebagai sistem pendingin komputer.", "Sebagai tempat penyimpanan data permanen.", "Sebagai perintah atau instruksi yang diberikan pengguna kepada KA.", "Sebagai aplikasi antivirus."], answer: 2 },
            { id: 11, question: "Ketika KA membuat lagu baru berdasarkan gaya musik seorang musisi terkenal, isu etika yang paling sering muncul adalah...", options: ["Pelanggaran hak cipta dan penggunaan karya tanpa izin.", "Lagu tersebut tidak enak didengar.", "Lagu tersebut terlalu panjang durasinya.", "KA menghabiskan banyak kuota internet."], answer: 0 },
            { id: 12, question: "Kita tidak boleh memasukkan data pribadi seperti alamat rumah atau kata sandi ke dalam chatbot KA karena….", options: ["KA akan memberikan data tersebut ke polisi.", "Akan membuat koneksi internet terputus.", "KA tidak mengerti alamat rumah.", "Data tersebut bisa disimpan dan digunakan untuk melatih model, sehingga berisiko bocor."], answer: 3 },
            { id: 13, question: "Siswa yang malas dan selalu menggunakan KA untuk menjawab semua soal tanpa belajar sendiri akan mengalami...", options: ["Peningkatan nilai rapor secara permanen.", "Kerusakan pada otak secara fisik.", "Kemunduran kemampuan kognitif dan daya analisis.", "Kecanduan bermain game online."], answer: 2 },
            { id: 14, question: "Di bawah ini adalah cara menggunakan KA secara bertanggung jawab, KECUALI...", options: ["Melakukan verifikasi fakta dari sumber buku.", "Mengakui jika tugas dibantu oleh KA.", "Menggunakan KA untuk membuat berita bohong (hoaks).", "Menggunakan KA untuk mencari ide kreatif."], answer: 2 },
            { id: 15, question: "Model KA perlu 'dimutakhirkan' secara berkala. Arti dari dimutakhirkan adalah….", options: ["Diperbarui dengan data terbaru agar tetap relevan.", "Dihapus total dan diganti baru", "Dijual ke perusahaan lain.", "Dimatikan agar tidak kepanasan."], answer: 0 },
            { id: 16, question: "Tujuan utama dari mempelajari Literasi Kecerdasan Artifisial bagi siswa SMP adalah….", options: ["Agar bisa menjadi hacker yang hebat.", "Agar tidak perlu lagi belajar di sekolah.", "Agar mampu menggunakan teknologi KA secara bijak, aman, dan kritis.", "Agar bisa memenangkan semua game komputer."], answer: 2 },
            { id: 17, question: "Yang dimaksud dengan 'Deepfake' adalah….", options: ["Pencarian internet yang sangat dalam.", "Teknologi KA untuk memanipulasi wajah atau suara orang agar terlihat sangat nyata.", "Kabel bawah laut untuk internet.", "Sistem keamanan bank yang sangat ketat."], answer: 1 },
            { id: 18, question: "Algoritma rekomendasi di YouTube menggunakan KA untuk...", options: ["Mempelajari minat kita dan menyarankan video yang mungkin kita sukai.", "Memaksa kita menonton iklan saja.", "Menghapus video yang kita tonton.", "Mematikan HP secara otomatis."], answer: 0 },
            { id: 19, question: "Jika data yang digunakan untuk melatih KA berisi banyak hoaks, maka hasil dari KA tersebut akan...", options: ["Tetap benar karena komputer sangat pintar.", "Menjadi sangat lambat diproses.", "Cenderung menghasilkan informasi yang salah atau menyesatkan.", "Langsung terhapus dari memori."], answer: 2 },
            { id: 20, question: "Salah satu kelebihan manusia dibanding KA dalam hal pekerjaan adalah kemampuan untuk...", options: ["Bekerja 24 jam tanpa henti.", "Melakukan perhitungan matematika tanpa salah sedikitpun.", "Mengingat triliunan data secara instan.", "Mengambil keputusan moral yang rumit berdasarkan hati nurani."], answer: 3 },
            { id: 21, question: "KA tidak memiliki kesadaran diri. Hal ini berarti KA...", options: ["Hanya memproses simbol dan pola tanpa memahami maknanya.", "Sangat sombong kepada penggunanya.", "Bisa merasakan sakit jika komputernya jatuh.", "Akan segera menguasai dunia."], answer: 0 },
            { id: 22, question: "Jika kamu menulis 'Buatkan rangkuman 3 paragraf dalam bentuk poin-poin', kamu sedang mempraktikkan prinsip prompt...", options: ["Privasi", "Konteks", "Ambiguitas", "Spesifisitas (Specificity)"], answer: 3 },
            { id: 23, question: "Mengapa penting memberikan 'Konteks' (Context) saat memberi perintah pada KA?", options: ["Agar jumlah kata menjadi lebih pendek", "Supaya KA menjawab lebih cepat dalam detik", "Agar KA memahami latar belakang dari kebutuhanmu dan menyesuaikan gaya jawaban", "Menghapus chat lama"], answer: 2 },
            { id: 24, question: "Manakah contoh prompt yang PALING BAIK jika kamu ingin mempelajari suatu teori?", options: ["'Ketikkan semua pengetahuanmu tentang sains dalam 1 paragraf.'", "'Jelaskan teori relativitas dengan bahasa yang mudah untuk siswa SMP, berikan contoh sehari-hari.'", "'Jelaskan fisika.'", "'Aku tidak mengerti ini tolong bantu.'"], answer: 1 },
            { id: 25, question: "Tujuan dari menggunakan prinsip dasar dalam Prompt Engineering adalah untuk menghindari masalah, KECUALI...", options: ["Jawaban KA yang bias dan tidak akurat", "Informasi yang menyesatkan", "Pengulangan pertanyaan berulang kali", "Terbentuknya karya seni digital yang indah"], answer: 3 },
        ];

        // GANTI URL INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA YANG BARU (VERSI 'ANYONE')
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyWw16vzWljD0CiKxUE-EGcS9QiO2qaOV4Nv70QHJUFe_7ydOb9bQd4VoOIbwBiG7Pekg/exec"; 

        const App = () => {
            const [step, setStep] = useState('login'); // 'login', 'exam', 'result'
            
            // Student State
            const [student, setStudent] = useState({ name: '', gender: '', class: '7.1', token: '' });
            const [tokenAttempts, setTokenAttempts] = useState([]); // Mencatat token salah
            const [loginError, setLoginError] = useState('');

            // Exam State
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [answers, setAnswers] = useState(Array(25).fill(null));
            const [cheatCount, setCheatCount] = useState(0);
            
            // UI State
            const [showCheatWarning, setShowCheatWarning] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState(null);

            // Handle Input Login
            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setStudent(prev => ({ ...prev, [name]: value }));
                if (name === 'token') setLoginError('');
            };

            // Handle Login Submission
            const handleStartExam = (e) => {
                e.preventDefault();
                if (!student.name || !student.gender || !student.class || !student.token) {
                    setLoginError('Harap lengkapi semua data!');
                    return;
                }

                if (student.token.toUpperCase() !== 'KKA2026') {
                    setLoginError('Token Ujian Tidak Valid!');
                    setTokenAttempts(prev => [...prev, student.token]);
                    return;
                }
                
                // Mulai Ujian
                setStep('exam');
            };

            // Deteksi Kecurangan (Berpindah Tab)
            useEffect(() => {
                if (step !== 'exam') return;

                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        setCheatCount(prev => prev + 1);
                        setShowCheatWarning(true);
                    }
                };

                document.addEventListener("visibilitychange", handleVisibilityChange);
                return () => {
                    document.removeEventListener("visibilitychange", handleVisibilityChange);
                };
            }, [step]);

            // Handle Jawaban
            const handleAnswer = (optionIndex) => {
                const newAnswers = [...answers];
                newAnswers[currentQIndex] = optionIndex;
                setAnswers(newAnswers);
            };

            // Navigasi Soal
            const nextQ = () => { if (currentQIndex < 24) setCurrentQIndex(prev => prev + 1); };
            const prevQ = () => { if (currentQIndex > 0) setCurrentQIndex(prev => prev - 1); };

            // Kirim Jawaban
            const handleSubmitExam = async () => {
                setIsSubmitting(true);
                
                // Hitung Skor
                let correctAnswers = 0;
                answers.forEach((ans, index) => {
                    if (ans === questionsData[index].answer) {
                        correctAnswers++;
                    }
                });

                const rawScore = correctAnswers * 2;
                const penalty = cheatCount * 2;
                const finalScore = Math.max(0, rawScore - penalty); // Pastikan skor tidak minus

                const payload = {
                    waktuSelesai: new Date().toLocaleString("id-ID"),
                    nama: student.name,
                    jenisKelamin: student.gender,
                    kelas: student.class,
                    tokenDipakai: student.token.toUpperCase(),
                    riwayatTokenSalah: tokenAttempts.join(", ") || "-",
                    jumlahBenar: correctAnswers,
                    jumlahKecurangan: cheatCount,
                    totalPenguranganSkor: penalty,
                    skorAkhir: finalScore,
                    detailJawaban: JSON.stringify(answers)
                };

                console.log("Mengirim data ke GAS:", payload); // Log untuk pengecekan

                try {
                    // Gunakan mode no-cors dan memastikan text/plain
                    await fetch(GOOGLE_SCRIPT_URL, {
                        redirect: "follow", // Tambahan penting untuk mengikuti sistem alihan server Google
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    setSubmitStatus('success');
                } catch (error) {
                    console.error("Gagal mengirim:", error);
                    setSubmitStatus('success_offline'); 
                } finally {
                    setStep('result');
                    setIsSubmitting(false);
                }
            };

            // KOMPONEN RENDER
            if (step === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-8 border-blue-600">
                            <div className="text-center mb-8">
                                <h1 className="text-2xl font-bold text-gray-800">SUMATIF BAB III</h1>
                                <p className="text-sm font-semibold text-gray-600 mt-1">TAHUN PELAJARAN 2025/2026</p>
                                <p className="text-sm text-gray-500">SMP NEGERI 1 KARIMUN</p>
                                <div className="mt-3 bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-bold inline-block">
                                    KODING DAN KECERDASAN ARTIFISIAL
                                </div>
                            </div>

                            <form onSubmit={handleStartExam} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nama Murid</label>
                                    <input type="text" name="name" value={student.name} onChange={handleInputChange} className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Masukkan Nama Lengkap" required />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Jenis Kelamin</label>
                                    <select name="gender" value={student.gender} onChange={handleInputChange} className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" required>
                                        <option value="">-- Pilih Jenis Kelamin --</option>
                                        <option value="Laki-laki">Laki-laki</option>
                                        <option value="Perempuan">Perempuan</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
                                    <select name="class" value={student.class} onChange={handleInputChange} className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" required>
                                        <option value="7.1">Kelas 7.1</option>
                                        <option value="7.2">Kelas 7.2</option>
                                        <option value="7.3">Kelas 7.3</option>
                                        <option value="7.4">Kelas 7.4</option>
                                        <option value="7.5">Kelas 7.5</option>
                                        <option value="7.6">Kelas 7.6</option>
                                        <option value="7.7">Kelas 7.7</option>
                                        <option value="7.8">Kelas 7.8</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nomor Token Ujian</label>
                                    <input type="text" name="token" value={student.token} onChange={handleInputChange} className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase" placeholder="Masukkan Token" required />
                                    {loginError && <p className="text-red-500 text-sm mt-1 font-medium">{loginError}</p>}
                                </div>

                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 mt-4 shadow-lg">
                                    MULAI UJIAN
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (step === 'exam') {
                const question = questionsData[currentQIndex];
                const answeredCount = answers.filter(a => a !== null).length;
                const isAllAnswered = answeredCount === 25;

                return (
                    <div className="min-h-screen flex flex-col bg-gray-50">
                        {/* Header */}
                        <header className="bg-white shadow-sm p-4 sticky top-0 z-10 flex flex-wrap justify-between items-center gap-4">
                            <div>
                                <h2 className="font-bold text-gray-800">{student.name}</h2>
                                <span className="text-xs bg-gray-200 px-2 py-1 rounded-md text-gray-700">Kelas {student.class}</span>
                            </div>
                            <div className="flex items-center gap-3">
                                {cheatCount > 0 && (
                                    <div className="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold border border-red-300 animate-pulse">
                                        Peringatan Kecurangan: {cheatCount}x ({-cheatCount * 2} Poin)
                                    </div>
                                )}
                                <div className="text-sm font-semibold bg-blue-100 text-blue-800 px-3 py-1 rounded-full">
                                    Soal Dijawab: {answeredCount}/25
                                </div>
                            </div>
                        </header>

                        {/* Modal Peringatan Kecurangan */}
                        {showCheatWarning && (
                            <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
                                <div className="bg-white rounded-xl p-6 max-w-sm text-center shadow-2xl border-t-8 border-red-600">
                                    <div className="text-red-500 mb-3">
                                        <svg className="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                    </div>
                                    <h3 className="text-xl font-bold text-gray-900 mb-2">Peringatan Kecurangan!</h3>
                                    <p className="text-gray-600 mb-4 text-sm">Anda terdeteksi berpindah layar/tab aplikasi. Sesuai aturan, skor Anda akan dikurangi <b>2 poin</b>.</p>
                                    <button onClick={() => setShowCheatWarning(false)} className="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg w-full">
                                        Saya Mengerti
                                    </button>
                                </div>
                            </div>
                        )}

                        <div className="flex-1 flex flex-col md:flex-row max-w-6xl w-full mx-auto p-4 gap-6">
                            
                            {/* Area Soal */}
                            <div className="flex-1 bg-white rounded-2xl shadow-md p-6 lg:p-8 flex flex-col">
                                <div className="mb-6 flex justify-between items-center border-b pb-4">
                                    <h3 className="text-xl font-bold text-blue-800">Soal No. {question.id}</h3>
                                </div>
                                
                                <p className="text-lg text-gray-800 mb-6 leading-relaxed">{question.question}</p>
                                
                                <div className="space-y-3 flex-1">
                                    {question.options.map((opt, idx) => (
                                        <label 
                                            key={idx} 
                                            onClick={() => handleAnswer(idx)}
                                            className={`block p-4 rounded-xl border-2 cursor-pointer transition duration-200 ${answers[currentQIndex] === idx ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:bg-gray-50'}`}
                                        >
                                            <div className="flex items-center gap-3">
                                                <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${answers[currentQIndex] === idx ? 'border-blue-500' : 'border-gray-400'}`}>
                                                    {answers[currentQIndex] === idx && <div className="w-2.5 h-2.5 bg-blue-500 rounded-full"></div>}
                                                </div>
                                                <span className="text-gray-700 font-medium">{opt}</span>
                                            </div>
                                        </label>
                                    ))}
                                </div>

                                {/* Tombol Bawah Soal */}
                                <div className="flex justify-between items-center mt-8 pt-4 border-t">
                                    <button onClick={prevQ} disabled={currentQIndex === 0} className={`px-5 py-2.5 rounded-lg font-semibold transition ${currentQIndex === 0 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
                                        &laquo; Sebelumnya
                                    </button>
                                    <button onClick={nextQ} disabled={currentQIndex === 24} className={`px-5 py-2.5 rounded-lg font-semibold transition ${currentQIndex === 24 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}`}>
                                        Selanjutnya &raquo;
                                    </button>
                                </div>
                            </div>

                            {/* Sidebar Navigasi */}
                            <div className="w-full md:w-72 bg-white rounded-2xl shadow-md p-6 h-fit shrink-0">
                                <h3 className="font-bold text-gray-800 mb-4 text-center">Navigasi Soal</h3>
                                <div className="grid grid-cols-5 gap-2">
                                    {answers.map((ans, idx) => (
                                        <button 
                                            key={idx}
                                            onClick={() => setCurrentQIndex(idx)}
                                            className={`aspect-square rounded-lg font-bold text-sm flex items-center justify-center transition border-2
                                                ${currentQIndex === idx ? 'border-blue-800 ring-2 ring-blue-300' : 'border-transparent'}
                                                ${ans !== null ? 'bg-blue-600 text-white shadow-sm' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}
                                            `}
                                        >
                                            {idx + 1}
                                        </button>
                                    ))}
                                </div>
                                
                                <div className="mt-8">
                                    <button 
                                        onClick={handleSubmitExam}
                                        disabled={isSubmitting}
                                        className={`w-full py-3 rounded-lg font-bold text-white shadow-lg transition duration-200 
                                            ${isAllAnswered ? 'bg-green-600 hover:bg-green-700 animate-bounce' : 'bg-orange-500 hover:bg-orange-600'}
                                            ${isSubmitting ? 'opacity-75 cursor-wait' : ''}
                                        `}
                                    >
                                        {isSubmitting ? 'MENGIRIM...' : 'KIRIM JAWABAN'}
                                    </button>
                                    {!isAllAnswered && (
                                        <p className="text-xs text-center text-orange-600 mt-2 font-semibold">
                                            Masih ada {25 - answeredCount} soal yang belum dijawab!
                                        </p>
                                    )}
                                </div>
                            </div>

                        </div>
                    </div>
                );
            }

            if (step === 'result') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg text-center border-t-8 border-green-500">
                            <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                <svg className="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Ujian Selesai!</h2>
                            <p className="text-gray-600 mb-6">Terima kasih <b>{student.name}</b>. Jawaban Anda telah direkam.</p>
                            
                            <div className="bg-gray-50 p-4 rounded-xl text-left space-y-3 mb-6">
                                <p className="text-sm text-gray-600 flex justify-between border-b pb-1"><span>Status Pengiriman:</span> <strong className={submitStatus === 'success' ? 'text-green-600' : 'text-orange-500'}>{submitStatus === 'success' ? 'Berhasil tersimpan ke Spreadsheet' : 'Selesai (Perlu pengecekan koneksi spreadsheet)'}</strong></p>
                                <p className="text-sm text-gray-600 flex justify-between border-b pb-1"><span>Catatan Kecurangan:</span> <strong className={cheatCount > 0 ? 'text-red-600' : 'text-green-600'}>{cheatCount} kali (-{cheatCount * 2} Poin)</strong></p>
                            </div>

                            <p className="text-xs text-gray-400">Anda sekarang dapat menutup halaman web ini.</p>
                        </div>
                    </div>
                );
            }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
